name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish:
        description: Publish to NPM and Docker
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit and tag
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Get new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build

      - name: Commit version bump and push tag
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push --follow-tags

      - name: Upload build artifact
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            package.json
            package-lock.json
            README.md

  publish-npm:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # OIDC trusted publishing

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      - name: Publish to NPM
        run: npm publish --access public --provenance

  publish-docker:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.build.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            deventerprisesoftware/scrapi-mcp:v${{ needs.build.outputs.version }}
            deventerprisesoftware/scrapi-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub release

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
